<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Table – habit tracker: a monthly table of habits, streaks and statistics, printable sheet with photo import. Works offline."
    />
    <!-- Цвет строки состояния до загрузки скрипта; дальше его ведёт App.vue по выбранной теме -->
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicons/favicon.svg" type="image/svg+xml" />
    <title>Table</title>
    <!--
      Тема, язык и направление текста до загрузки приложения: без вспышки светлой темы и
      перестройки в RTL. Повторяет currentTheme (useHabitUtils.js) и applyLang (i18n.js).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('theme');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          var color = dark ? '#121211' : '#f7f7f5';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.removeAttribute('media');
            meta.content = color;
          });

          var langs = ['en', 'ru', 'ar', 'es', 'zh'];
          var lang = localStorage.getItem('lang');
          if (langs.indexOf(lang) < 0) {
            var nav = (navigator.language || '').toLowerCase();
            lang =
              langs.filter(function (code) {
                return nav.indexOf(code) === 0;
              })[0] || 'en';
          }
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (error) {
          /* Хранилище недоступно: тему и язык поставит приложение */
        }
      })();
    </script>
  </head>

  <body>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Table needs JavaScript to run. Включите JavaScript, чтобы пользоваться Table.
      </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
